<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jai Ganesh — Designer &amp; Maker</title>
    <meta name="description"
        content="Portfolio of Jai Ganesh — mechanical designer and maker. 3D modeling with FreeCAD, metal fabrication, and AI-assisted apps.">
    <meta name="theme-color" content="#f7f9fc">

    <!-- Open Graph / social sharing -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Jai Ganesh — Designer & Maker">
    <meta property="og:description"
        content="Mechanical design, metal fabrication, and AI-assisted apps. Explore my work.">
    <meta property="og:image" content="https://jaigansa.github.io/assets/images/profile.jpg">
    <meta property="og:url" content="https://jaigansa.github.io/">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Jai Ganesh — Designer & Maker">
    <meta name="twitter:description" content="Mechanical design, metal fabrication, and AI-assisted apps.">
    <meta name="twitter:image" content="https://jaigansa.github.io/assets/images/profile.jpg">

    <link rel="icon" type="image/jpeg" href="./assets/images/profile.jpg">

    <link rel="preload" href="assets/fonts/inter/Inter-Regular.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="assets/fonts/inter/Inter-Medium.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="assets/fonts/inter/Inter-SemiBold.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="assets/fonts/plus-jakarta-sans/PlusJakartaSans-Bold.woff2" as="font" type="font/woff2"
        crossorigin>

    <script type="application/ld+json">
        {
            "@context": "https://schema.org",
            "@type": "Person",
            "name": "Jai Ganesh",
            "url": "https://jaigansa.github.io",
            "image": "https://jaigansa.github.io/assets/images/profile.jpg",
            "sameAs": [
                "https://github.com/jaigansa",
                "https://x.com/jaigansa"
            ]
        }
    </script>

    <style>
        @font-face {
            font-family: 'Inter';
            src: url('./assets/fonts/inter/Inter-Regular.woff2') format('woff2');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'Inter';
            src: url('./assets/fonts/inter/Inter-Medium.woff2') format('woff2');
            font-weight: 500;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'Inter';
            src: url('./assets/fonts/inter/Inter-SemiBold.woff2') format('woff2');
            font-weight: 600;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'Plus Jakarta Sans';
            src: url('./assets/fonts/plus-jakarta-sans/PlusJakartaSans-Bold.woff2') format('woff2');
            font-weight: 700;
            font-style: normal;
            font-display: swap;
        }

        :root {
            --bg: #f7f9fc;
            --card-bg: rgba(255, 255, 255, 0.72);
            --card-hover: rgba(255, 255, 255, 0.92);
            --card-border: rgba(15, 23, 42, 0.07);
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --primary-light: rgba(37, 99, 235, 0.09);
            --primary-border: rgba(37, 99, 235, 0.22);
            --text-main: #0f172a;
            --text-muted: #5b6470;
            --glass: rgba(255, 255, 255, 0.65);
            --glass-border: rgba(255, 255, 255, 0.9);
            --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.04), 0 4px 16px rgba(15, 23, 42, 0.05);
            --shadow-md: 0 8px 24px -6px rgba(15, 23, 42, 0.12), 0 4px 8px -4px rgba(15, 23, 42, 0.06);
            --shadow-primary: 0 10px 20px -6px rgba(37, 99, 235, 0.35);
            --ease: 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            color-scheme: light dark;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0b1120;
                --card-bg: rgba(255, 255, 255, 0.05);
                --card-hover: rgba(255, 255, 255, 0.09);
                --card-border: rgba(255, 255, 255, 0.1);
                --primary-light: rgba(59, 130, 246, 0.14);
                --primary-border: rgba(59, 130, 246, 0.3);
                --text-main: #e7ecf5;
                --text-muted: #9aa6b8;
                --glass: rgba(255, 255, 255, 0.05);
                --glass-border: rgba(255, 255, 255, 0.12);
                --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3), 0 4px 16px rgba(0, 0, 0, 0.25);
                --shadow-md: 0 8px 24px -6px rgba(0, 0, 0, 0.5), 0 4px 8px -4px rgba(0, 0, 0, 0.3);
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            color-scheme: light dark;
        }

        body {
            background:
                radial-gradient(1100px 560px at 100% -10%, rgba(37, 99, 235, 0.08), transparent 60%),
                radial-gradient(900px 500px at -10% 110%, rgba(99, 102, 241, 0.07), transparent 60%),
                var(--bg);
            color: var(--text-main);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            min-height: 100vh;
            min-height: 100dvh;
            overflow-x: hidden;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            -webkit-font-smoothing: antialiased;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        ::selection {
            background: var(--primary);
            color: #fff;
        }

        /* Content Container */
        .linktree-container {
            max-width: 600px;
            width: 100%;
            padding: 56px 20px 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
            z-index: 1;
        }

        /* Profile Header */
        .profile-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 16px;
            width: 100%;
            margin-bottom: 12px;
        }

        .avatar-wrapper {
            display: block;
            width: 96px;
            height: 96px;
            border-radius: 50%;
        }

        .profile-avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--glass-border);
            box-shadow: var(--shadow-md);
            transition: var(--ease);
        }

        .avatar-wrapper:hover .profile-avatar {
            transform: scale(1.04);
            box-shadow: 0 12px 28px -8px rgba(37, 99, 235, 0.35);
        }

        .profile-name {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--text-main);
            line-height: 1.2;
        }

        .profile-bio {
            font-size: 0.95rem;
            color: var(--text-muted);
            line-height: 1.65;
            max-width: 460px;
            font-weight: 500;
        }

        .social-links {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-top: 4px;
        }

        .social-icon-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--glass);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: var(--text-muted);
            transition: var(--ease);
            text-decoration: none;
            box-shadow: var(--shadow-sm);
        }

        .social-icon-btn svg,
        .social-icon-btn i {
            width: 20px;
            height: 20px;
            transition: transform 0.3s ease;
        }

        .social-icon-btn:hover {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
            transform: translateY(-3px);
            box-shadow: var(--shadow-primary);
        }

        .social-icon-btn:hover svg,
        .social-icon-btn:hover i {
            transform: scale(1.1);
        }

        /* Links List */
        .links-list {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        /* General Card Design */
        .link-card {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 16px 18px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: var(--shadow-sm);
            text-decoration: none;
            color: inherit;
            width: 100%;
            transition: var(--ease);
            position: relative;
            overflow: hidden;
        }

        .link-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.18), transparent);
            transition: 0.5s;
            pointer-events: none;
        }

        .link-card.clickable:hover::before {
            left: 100%;
        }

        .link-card.clickable {
            cursor: pointer;
        }

        .link-card.clickable:hover {
            transform: translateY(-3px);
            background: var(--card-hover);
            border-color: var(--primary-border);
            box-shadow: var(--shadow-md);
        }

        .link-card.clickable:active {
            transform: translateY(-1px);
        }

        /* Focus visibility */
        a:focus-visible,
        button:focus-visible {
            outline: 2px solid var(--primary);
            outline-offset: 3px;
            border-radius: 8px;
        }

        /* Thumbnail Visuals */
        .link-image-wrap {
            width: 56px;
            height: 56px;
            border-radius: 12px;
            overflow: hidden;
            flex-shrink: 0;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow-sm);
        }

        .link-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .link-card.clickable:hover .link-image {
            transform: scale(1.06);
        }

        .link-icon-wrap {
            width: 56px;
            height: 56px;
            border-radius: 12px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--primary-light);
            color: var(--primary);
            border: 1px solid var(--primary-border);
        }

        .link-icon-wrap svg,
        .link-icon-wrap i {
            width: 24px;
            height: 24px;
        }

        /* Link Card Text Content */
        .link-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
            text-align: left;
        }

        .link-title {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--text-main);
            line-height: 1.25;
        }

        .link-description {
            font-size: 0.85rem;
            color: var(--text-muted);
            line-height: 1.5;
            font-weight: 500;
        }

        .link-arrow {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            opacity: 0.4;
            transition: var(--ease);
            background: var(--glass);
            border: 1px solid var(--glass-border);
            flex-shrink: 0;
        }

        .link-arrow svg,
        .link-arrow i {
            width: 18px;
            height: 18px;
        }

        .link-card.clickable:hover .link-arrow {
            opacity: 1;
            color: var(--primary);
            background: var(--card-hover);
            border-color: var(--primary-border);
            transform: translateX(3px);
        }

        /* Skills Card */
        .skills-card {
            flex-direction: column;
            align-items: flex-start;
            gap: 14px;
            cursor: default;
        }

        .skills-header {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
        }

        .skills-title {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            width: 100%;
        }

        .tags span {
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--primary);
            background: var(--primary-light);
            border: 1px solid var(--primary-border);
            padding: 5px 12px;
            border-radius: 100px;
            transition: var(--ease);
        }

        .tags span:hover {
            background: var(--primary);
            color: #fff;
            transform: translateY(-2px);
        }

        /* QR Code Card - Collapsible Drawer */
        .qr-card {
            flex-direction: column;
            align-items: stretch;
            padding: 0;
        }

        .qr-trigger {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 16px 18px;
            cursor: pointer;
            background: transparent;
            border: none;
            width: 100%;
            color: inherit;
            text-align: left;
            font-family: inherit;
        }

        .qr-drawer {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
            opacity: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: var(--card-hover);
            border-top: 1px solid var(--card-border);
        }

        .qr-card.expanded .qr-drawer {
            max-height: 360px;
            opacity: 1;
        }

        .qr-card.expanded .link-arrow {
            transform: rotate(90deg);
            opacity: 0.8;
            color: var(--primary);
        }

        .qr-drawer-content {
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            width: 100%;
        }

        .qr-container {
            width: 180px;
            height: 180px;
            background: #fff;
            padding: 10px;
            border-radius: 16px;
            box-shadow: var(--shadow-sm);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .qr-container img,
        .qr-container canvas {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
        }

        .qr-caption {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 500;
            text-align: center;
        }

        /* Quote Card */
        .quote-card {
            flex-direction: column;
            align-items: flex-start;
            gap: 12px;
            padding: 20px 22px;
        }

        .quote-header {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--primary);
        }

        .quote-header svg,
        .quote-header i {
            width: 18px;
            height: 18px;
        }

        .quote-title {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 0.08em;
        }

        .quote-text {
            font-size: 1.05rem;
            font-style: italic;
            color: var(--text-main);
            line-height: 1.6;
            font-weight: 500;
        }

        /* Footer Section */
        .footer-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-top: 24px;
            gap: 8px;
        }

        .footer-text {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .footer-heart {
            color: #ef4444;
            animation: heartPulse 1.5s infinite ease-in-out;
            display: inline-block;
            width: 16px;
            height: 16px;
        }

        @keyframes heartPulse {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.2);
            }
        }

        /* Collapsible Project Card styles */
        .project-card {
            flex-direction: column;
            align-items: stretch;
            padding: 0;
        }

        .project-trigger {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 16px 18px;
            cursor: pointer;
            background: transparent;
            border: none;
            width: 100%;
            color: inherit;
            text-align: left;
            font-family: inherit;
        }

        .project-drawer {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
            opacity: 0;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            background: var(--card-hover);
            border-top: 1px solid var(--card-border);
        }

        .project-card.expanded .project-drawer {
            max-height: 480px;
            opacity: 1;
        }

        .project-card.expanded .link-arrow {
            transform: rotate(90deg);
            opacity: 0.8;
            color: var(--primary);
        }

        .project-drawer-content {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Gallery Grid inside drawers */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            width: 100%;
        }

        .gallery-thumb-wrap {
            aspect-ratio: 1 / 1;
            border-radius: 12px;
            overflow: hidden;
            cursor: zoom-in;
            background: var(--glass);
            border: 1px solid var(--card-border);
            box-shadow: var(--shadow-sm);
            transition: var(--ease);
        }

        .gallery-thumb-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .gallery-thumb-wrap:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: var(--shadow-md);
            border-color: var(--primary-border);
        }

        .gallery-thumb-wrap:hover img {
            transform: scale(1.04);
        }

        /* Drawer CTA visit button */
        .drawer-cta-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            background: var(--primary);
            color: #fff;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 0.9rem;
            font-weight: 700;
            text-decoration: none;
            transition: var(--ease);
            border: none;
            cursor: pointer;
            box-shadow: var(--shadow-primary);
        }

        .drawer-cta-btn:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
        }

        .drawer-cta-btn svg,
        .drawer-cta-btn i {
            width: 16px;
            height: 16px;
        }

        /* Full-screen Lightbox viewer */
        .lightbox-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .lightbox-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .lightbox-content-wrap {
            position: relative;
            max-width: 90vw;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .lightbox-img {
            max-width: 100%;
            max-height: 75vh;
            object-fit: contain;
            border-radius: 16px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transform: scale(0.95);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .lightbox-overlay.active .lightbox-img {
            transform: scale(1);
        }

        .lightbox-close-btn {
            position: absolute;
            top: -44px;
            right: 0;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--ease);
        }

        .lightbox-close-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.1);
        }

        .lightbox-close-btn svg,
        .lightbox-close-btn i {
            width: 20px;
            height: 20px;
        }

        /* Responsiveness adjustments */
        @media (max-width: 480px) {
            .linktree-container {
                padding: 40px 16px 30px 16px;
                gap: 18px;
            }

            .profile-name {
                font-size: 1.4rem;
            }

            .link-card {
                padding: 12px 14px;
                gap: 12px;
                border-radius: 14px;
            }

            .link-image-wrap,
            .link-icon-wrap {
                width: 48px;
                height: 48px;
                border-radius: 10px;
            }

            .link-icon-wrap svg,
            .link-icon-wrap i {
                width: 22px;
                height: 22px;
            }

            .link-title {
                font-size: 1rem;
            }

            .link-description {
                font-size: 0.8rem;
            }

            .social-icon-btn {
                width: 40px;
                height: 40px;
            }
        }

        /* Respect reduced-motion preferences */
        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation: none !important;
                transition: none !important;
            }
        }
    </style>
</head>

<body>

    <main class="linktree-container">
        <div id="profile-section" class="profile-header"></div>
        <div id="links-container" class="links-list"></div>
        <footer id="footer-section" class="footer-wrapper"></footer>
    </main>

    <!-- Lightbox Modal overlay -->
    <div class="lightbox-overlay" id="lightbox">
        <div class="lightbox-content-wrap">
            <button type="button" class="lightbox-close-btn" id="lightbox-close" aria-label="Close Lightbox">
                <i data-lucide="x"></i>
            </button>
            <img src="" alt="Fullscreen View" class="lightbox-img" id="lightbox-img">
        </div>
    </div>

    <!-- Dependencies -->
    <script src="assets/js/lucide.min.js" defer></script>
    <script src="assets/js/qrcode.min.js" defer></script>
    <script src="data.js" defer></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const profileSection = document.getElementById('profile-section');
            const linksContainer = document.getElementById('links-container');
            const footerSection = document.getElementById('footer-section');

            function renderProfile(profile) {
                if (!profileSection || !profile) return;

                const avatarHtml = profile.email ?
                    `<a href="${profile.email}" class="avatar-wrapper" aria-label="Contact ${profile.name}">
                        <img src="${profile.image}" alt="${profile.name}" class="profile-avatar">
                     </a>` :
                    `<div class="avatar-wrapper">
                        <img src="${profile.image}" alt="${profile.name}" class="profile-avatar">
                     </div>`;

                const titleHtml = profile.name ? `<h1 class="profile-name">${profile.name}</h1>` : '';
                const descHtml = profile.bio ? `<p class="profile-bio">${profile.bio}</p>` : '';

                let socialsHtml = '';
                if (profile.socials && profile.socials.length > 0) {
                    socialsHtml = `
                        <div class="social-links">
                            ${profile.socials.map(s => `
                                <a href="${s.url}" target="_blank" rel="noopener" class="social-icon-btn" aria-label="${s.label || s.icon}">
                                    <i data-lucide="${s.icon}"></i>
                                </a>
                            `).join('')}
                        </div>
                    `;
                }

                profileSection.innerHTML = avatarHtml + titleHtml + descHtml + socialsHtml;
            }

            function renderLinkList(links) {
                if (!linksContainer || !links) return;
                linksContainer.innerHTML = '';

                links.forEach((card, index) => {
                    if (card.isVisible === false) return;

                    const cardEl = document.createElement('div');
                    cardEl.className = 'link-card-wrapper';
                    cardEl.style.width = '100%';

                    if (card.type === 'project') {
                        const hasImages = card.images && card.images.length > 0;
                        if (hasImages) {
                            const gridHtml = card.images.map(img => `
                                <div class="gallery-thumb-wrap" data-img-src="${img}">
                                    <img src="${img}" alt="${card.title} photo" loading="lazy">
                                </div>
                            `).join('');

                            cardEl.innerHTML = `
                                <div class="link-card project-card" id="project-card-${index}" data-type="project">
                                    <button type="button" class="project-trigger" aria-expanded="false" aria-controls="project-drawer-${index}">
                                        <div class="link-image-wrap">
                                            <img src="${card.image}" alt="${card.title}" class="link-image" loading="lazy">
                                        </div>
                                        <div class="link-info">
                                            <h2 class="link-title">${card.title}</h2>
                                            <p class="link-description">${card.description}</p>
                                        </div>
                                        <div class="link-arrow">
                                            <i data-lucide="chevron-right"></i>
                                        </div>
                                    </button>
                                    <div class="project-drawer" id="project-drawer-${index}">
                                        <div class="project-drawer-content">
                                            <div class="gallery-grid">
                                                ${gridHtml}
                                            </div>
                                            <a href="${card.url}" target="_blank" rel="noopener" class="drawer-cta-btn">
                                                <span>Visit Project Link</span>
                                                <i data-lucide="external-link"></i>
                                            </a>
                                        </div>
                                    </div>
                                </div>
                            `;
                        } else {
                            cardEl.innerHTML = `
                                <a href="${card.url}" target="_blank" rel="noopener" class="link-card clickable" data-type="project">
                                    <div class="link-image-wrap">
                                        <img src="${card.image}" alt="${card.title}" class="link-image" loading="lazy">
                                    </div>
                                    <div class="link-info">
                                        <h2 class="link-title">${card.title}</h2>
                                        <p class="link-description">${card.description}</p>
                                    </div>
                                    <div class="link-arrow">
                                        <i data-lucide="chevron-right"></i>
                                    </div>
                                </a>
                            `;
                        }
                    } else if (card.type === 'skills') {
                        const tagsHtml = (card.tags && card.tags.length > 0) ?
                            `<div class="tags">${card.tags.map(tag => `<span>${tag}</span>`).join('')}</div>` : '';

                        cardEl.innerHTML = `
                            <div class="link-card skills-card" data-type="skills">
                                <div class="skills-header">
                                    <div class="link-icon-wrap">
                                        <i data-lucide="database"></i>
                                    </div>
                                    <h2 class="skills-title">${card.title}</h2>
                                </div>
                                ${tagsHtml}
                            </div>
                        `;
                    } else if (card.type === 'qrcode') {
                        cardEl.innerHTML = `
                            <div class="link-card qr-card" id="qr-card-${index}" data-type="qrcode">
                                <button type="button" class="qr-trigger" aria-expanded="false" aria-controls="qr-drawer-${index}">
                                    <div class="link-icon-wrap">
                                        <i data-lucide="qr-code"></i>
                                    </div>
                                    <div class="link-info">
                                        <h2 class="link-title">${card.title}</h2>
                                        <p class="link-description">${card.description}</p>
                                    </div>
                                    <div class="link-arrow">
                                        <i data-lucide="chevron-right"></i>
                                    </div>
                                </button>
                                <div class="qr-drawer" id="qr-drawer-${index}">
                                    <div class="qr-drawer-content">
                                        <div class="qr-container" id="qr-container-${index}"></div>
                                        <p class="qr-caption">Scan to open or view on mobile</p>
                                    </div>
                                </div>
                            </div>
                        `;
                    } else if (card.type === 'quote') {
                        const quoteInner = `
                            <div class="quote-header">
                                <i data-lucide="book-open"></i>
                                <span class="quote-title">${card.title}</span>
                            </div>
                            <p class="quote-text">${card.text}</p>
                        `;
                        cardEl.innerHTML = card.url
                            ? `<a href="${card.url}" target="_blank" rel="noopener" class="link-card quote-card clickable" data-type="quote">${quoteInner}</a>`
                            : `<div class="link-card quote-card" data-type="quote">${quoteInner}</div>`;
                    }

                    linksContainer.appendChild(cardEl);

                    // Dynamically generate QR code if it's the qrcode card
                    if (card.type === 'qrcode') {
                        const qrContainer = cardEl.querySelector(`#qr-container-${index}`);
                        if (qrContainer && window.QRCode) {
                            new QRCode(qrContainer, {
                                text: card.url,
                                width: 160,
                                height: 160,
                                colorDark: "#0f172a",
                                colorLight: "#ffffff",
                                correctLevel: QRCode.CorrectLevel.H
                            });
                        }
                    }
                });

                // Set up collapsible QR drawer click listener
                const qrCards = document.querySelectorAll('.qr-card');
                qrCards.forEach(qrCard => {
                    const trigger = qrCard.querySelector('.qr-trigger');
                    trigger.addEventListener('click', () => {
                        const isExpanded = qrCard.classList.contains('expanded');
                        qrCard.classList.toggle('expanded', !isExpanded);
                        trigger.setAttribute('aria-expanded', !isExpanded);
                    });
                });

                // Set up collapsible Project drawer click listener
                const projectCards = document.querySelectorAll('.project-card');
                projectCards.forEach(projCard => {
                    const trigger = projCard.querySelector('.project-trigger');
                    trigger.addEventListener('click', () => {
                        const isExpanded = projCard.classList.contains('expanded');
                        projCard.classList.toggle('expanded', !isExpanded);
                        trigger.setAttribute('aria-expanded', !isExpanded);
                    });
                });
            }

            function renderFooter(footerText) {
                if (!footerSection || !footerText) return;

                footerSection.innerHTML = `
                    <div class="footer-text">
                        <span>${footerText}</span>
                        <i data-lucide="heart" class="footer-heart"></i>
                    </div>
                `;
            }

            // Lightbox Viewer functionality
            const lightbox = document.getElementById('lightbox');
            const lightboxImg = document.getElementById('lightbox-img');
            const lightboxClose = document.getElementById('lightbox-close');

            function initLightbox() {
                if (!lightbox || !lightboxImg || !lightboxClose) return;

                linksContainer.addEventListener('click', (e) => {
                    const thumbWrap = e.target.closest('.gallery-thumb-wrap');
                    if (thumbWrap) {
                        e.preventDefault();
                        const imgSrc = thumbWrap.getAttribute('data-img-src');
                        if (imgSrc) {
                            lightboxImg.src = imgSrc;
                            lightbox.classList.add('active');
                        }
                    }
                });

                const closeLightbox = () => {
                    lightbox.classList.remove('active');
                    setTimeout(() => {
                        lightboxImg.src = '';
                    }, 300);
                };

                lightboxClose.addEventListener('click', closeLightbox);
                lightbox.addEventListener('click', (e) => {
                    if (e.target === lightbox) {
                        closeLightbox();
                    }
                });

                document.addEventListener('keydown', (e) => {
                    if (e.key === 'Escape' && lightbox.classList.contains('active')) {
                        closeLightbox();
                    }
                });
            }

            function init() {
                if (typeof portfolioConfig === 'undefined') {
                    console.error('portfolioConfig is not loaded. Make sure data.js is loaded first.');
                    return;
                }

                initLightbox();

                // Render sections
                renderProfile(portfolioConfig.profile);
                renderLinkList(portfolioConfig.links);
                if (portfolioConfig.profile) {
                    renderFooter(portfolioConfig.profile.footerText);
                }

                // Initialize Lucide icons
                if (window.lucide) {
                    lucide.createIcons();
                }
            }

            init();
        });
    </script>
</body>

</html>
