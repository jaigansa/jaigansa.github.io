                "https://x.com/jaigansa"
            ]
        }
    </script>

    <style>
        @font-face {
            font-family: 'Inter';
            src: url('./assets/fonts/inter/Inter-Regular.woff2') format('woff2');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'Inter';
            src: url('./assets/fonts/inter/Inter-Medium.woff2') format('woff2');
            font-weight: 500;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'Inter';
            src: url('./assets/fonts/inter/Inter-SemiBold.woff2') format('woff2');
            font-weight: 600;
            font-style: normal;
            font-display: swap;
        }

        :root {
            --bg: #ffffff;
            --surface: #f7f7f8;
            --border: #e8e8ec;
            --border-strong: #d4d4da;
            --text: #17171a;
            --muted: #6b7280;
            --faint: #9ca3af;
            --primary: #17171a;
            --primary-inverse: #ffffff;
            --ease: 0.18s ease;
            color-scheme: light dark;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0d0d0f;
                --surface: #151519;
                --border: #26262c;
                --border-strong: #3a3a42;
                --text: #ededf0;
                --muted: #9d9da6;
                --faint: #6b6b74;
                --primary: #ededf0;
                --primary-inverse: #0d0d0f;
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            color-scheme: light dark;
            scroll-behavior: smooth;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 16px;
            line-height: 1.55;
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        ::selection {
            background: var(--primary);
            color: var(--primary-inverse);
        }

        /* ---------- Navigation ---------- */
        .site-nav {
            position: sticky;
            top: 0;
            z-index: 50;
            background: color-mix(in srgb, var(--bg) 82%, transparent);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
        }

        .nav-inner {
            max-width: 720px;
            margin: 0 auto;
            height: 52px;
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .wordmark {
            font-size: 0.95rem;
            font-weight: 600;
            letter-spacing: -0.01em;
            color: var(--text);
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 22px;
        }

        .nav-links a {
            position: relative;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--muted);
            text-decoration: none;
            transition: color var(--ease);
            padding-bottom: 2px;
        }

        .nav-links a svg {
            width: 15px;
            height: 15px;
        }

        .nav-links a::after {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: 2px;
            border-radius: 2px;
            background: var(--primary);
            transform: scaleX(0);
            transform-origin: left center;
            transition: transform 0.25s ease;
        }

        .nav-links a:hover {
            color: var(--text);
        }

        .nav-links a:hover::after,
        .nav-links a.active::after {
            transform: scaleX(1);
        }

        /* ---------- Layout ---------- */
        .container {
            max-width: 720px;
            margin: 0 auto;
            padding: 0 20px;
        }

        section {
            scroll-margin-top: 72px;
        }

        /* ---------- Hero ---------- */
        .hero {
            padding: 64px 0 8px;
        }

        .hero-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 36px;
        }

        .hero-avatar {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            border: 2px solid var(--border);
            object-fit: cover;
            cursor: zoom-in;
            transition: transform var(--ease), border-color var(--ease), box-shadow var(--ease);
        }

        .hero-avatar:hover {
            transform: scale(1.08);
            border-color: var(--border-strong);
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.18);
        }

        .hero-socials {
            display: flex;
            gap: 8px;
        }

        .hero-socials a {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: 1px solid var(--border);
            color: var(--muted);
            transition: var(--ease);
        }

        .hero-socials a:hover {
            color: var(--text);
            border-color: var(--border-strong);
            background: var(--surface);
        }

        .hero-socials svg,
        .hero-socials i {
            width: 17px;
            height: 17px;
        }

        .hero-kicker {
            font-size: 0.78rem;
            font-weight: 600;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 12px;
        }

        .hero-name {
            font-size: clamp(2.1rem, 5vw, 2.9rem);
            font-weight: 600;
            letter-spacing: -0.03em;
            line-height: 1.05;
            margin-bottom: 18px;
            text-wrap: balance;
        }

        .hero-bio {
            font-size: 1.08rem;
            color: var(--muted);
            max-width: 560px;
            text-wrap: balance;
        }

        .hero-cta {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 30px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 11px 20px;
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: 600;
            text-decoration: none;
            transition: var(--ease);
        }

        .btn-primary {
            background: var(--primary);
            color: var(--primary-inverse);
        }

        .btn-primary:hover {
            opacity: 0.85;
        }

        .btn-ghost {
            border: 1px solid var(--border);
            color: var(--text);
            background: transparent;
        }

        .btn-ghost:hover {
            border-color: var(--border-strong);
            background: var(--surface);
        }

        .btn svg,
        .btn i {
            width: 16px;
            height: 16px;
        }

        /* ---------- Section headings ---------- */
        .section-head {
            display: flex;
            align-items: center;
            gap: 16px;
            margin: 72px 0 28px;
        }

        .section-head h2 {
            font-size: 1.05rem;
            font-weight: 600;
            letter-spacing: -0.01em;
            white-space: nowrap;
        }

        .section-head .rule {
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .section-head .count {
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--faint);
            white-space: nowrap;
        }

        /* ---------- Work grid ---------- */
        .work-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 22px;
        }

        .project-card {
            display: block;
            color: inherit;
        }

        .project-media {
            position: relative;
            aspect-ratio: 16 / 10;
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid var(--border);
            background: var(--surface);
            margin-bottom: 14px;
            cursor: default;
        }

        .project-media.zoomable {
            cursor: zoom-in;
        }

        .project-media img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.5s ease;
        }

        .project-card:hover .project-media img {
            transform: scale(1.04);
        }

        .project-count {
            position: absolute;
            right: 10px;
            bottom: 10px;
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 4px 9px;
            border-radius: 999px;
            font-size: 0.72rem;
            font-weight: 500;
            color: #fff;
            background: rgba(10, 10, 12, 0.55);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .project-count svg,
        .project-count i {
            width: 12px;
            height: 12px;
        }

        .project-body-link {
            display: block;
            text-decoration: none;
            color: inherit;
        }

        .project-body {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 4px;
        }

        .project-title {
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: -0.01em;
            transition: color var(--ease);
        }

        .project-card:hover .project-title {
            color: var(--muted);
        }

        .project-arrow {
            color: var(--muted);
            opacity: 0.5;
            transition: var(--ease);
            flex-shrink: 0;
        }

        .project-arrow svg,
        .project-arrow i {
            width: 15px;
            height: 15px;
        }

        .project-card:hover .project-arrow {
            opacity: 1;
            color: var(--text);
            transform: translateX(2px);
        }

        .project-desc {
            font-size: 0.85rem;
            color: var(--muted);
            line-height: 1.5;
        }

        /* ---------- Skills ---------- */
        .skills-list {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .skill-row {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .skill-top {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 12px;
        }

        .skill-name {
            font-size: 0.92rem;
            font-weight: 500;
        }

        .skill-level {
            font-size: 0.8rem;
            color: var(--muted);
            font-variant-numeric: tabular-nums;
        }

        .skill-bar {
            height: 6px;
            border-radius: 999px;
            background: var(--border);
            overflow: hidden;
        }

        .skill-bar-fill {
            height: 100%;
            width: 0%;
            border-radius: 999px;
            background: linear-gradient(90deg, var(--border-strong), var(--primary));
            transition: width 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* ---------- Contact ---------- */
        .contact-panel {
            display: grid;
            grid-template-columns: 1fr;
            gap: 28px;
            align-items: start;
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 32px;
            background: var(--surface);
        }

        .contact-info {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 18px;
        }

        .contact-heading {
            font-size: 1.35rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            text-wrap: balance;
        }

        .contact-blurb {
            font-size: 0.9rem;
            color: var(--muted);
            text-wrap: balance;
        }

        /* ---------- Form ---------- */
        .contact-form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .form-field {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .form-field label {
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.02em;
        }

        .form-field input,
        .form-field textarea {
            width: 100%;
            padding: 11px 13px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text);
            font-family: inherit;
            font-size: 0.92rem;
            line-height: 1.5;
            transition: var(--ease);
            resize: vertical;
        }

        .form-field textarea {
            min-height: 120px;
        }

        .form-field input::placeholder,
        .form-field textarea::placeholder {
            color: var(--faint);
        }

        .form-field input:focus,
        .form-field textarea:focus {
            outline: none;
            border-color: var(--border-strong);
            box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 8%, transparent);
        }

        .form-submit {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px;
            border-radius: 10px;
            border: none;
            background: var(--primary);
            color: var(--primary-inverse);
            font-family: inherit;
            font-size: 0.92rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--ease);
            margin-top: 4px;
        }

        .form-submit:hover {
            opacity: 0.85;
        }

        .form-submit:disabled {
            opacity: 0.6;
            cursor: default;
        }

        .form-submit svg,
        .form-submit i {
            width: 16px;
            height: 16px;
        }

        /* ---------- Flip card ---------- */
        .flip-card {
            perspective: 1400px;
        }

        .flip-inner {
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.7s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .flip-card.flipped .flip-inner {
            transform: rotateY(180deg);
        }

        .flip-face {
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }

        .flip-front {
            display: flex;
            flex-direction: column;
        }

        .flip-back {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            transform: rotateY(180deg);
        }

        .flip-footer {
            display: flex;
            justify-content: flex-end;
            margin-top: 14px;
        }

        .flip-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            padding: 0;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text);
            cursor: pointer;
            transition: var(--ease);
        }

        .flip-btn:hover {
            border-color: var(--border-strong);
            background: var(--surface);
        }

        .flip-btn svg,
        .flip-btn i {
            width: 16px;
            height: 16px;
        }

        /* ---------- Visiting card ---------- */
        .visit-card {
            background: var(--surface);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 28px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            justify-items: center;
            flex: 1;
        }

        .visit-main {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 14px;
        }

        .visit-head {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .visit-avatar {
            width: 76px;
            height: 76px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--border);
        }

        .visit-name {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text);
            letter-spacing: -0.01em;
        }

        .visit-role {
            font-size: 0.85rem;
            color: var(--muted);
        }

        .visit-email {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            transition: color var(--ease);
        }

        .visit-email:hover {
            color: var(--muted);
        }

        .visit-email svg,
        .visit-email i {
            width: 16px;
            height: 16px;
        }

        .visit-socials {
            display: flex;
            gap: 8px;
        }

        .visit-socials a {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--muted);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--ease);
        }

        .visit-socials a:hover {
            color: var(--text);
            border-color: var(--border-strong);
        }

        .visit-socials svg,
        .visit-socials i {
            width: 16px;
            height: 16px;
        }

        .visit-qr {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .visit-qr .qr-container {
            width: 160px;
            height: 160px;
            background: #fff;
            padding: 8px;
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        .visit-qr-caption {
            font-size: 0.72rem;
            color: var(--muted);
        }

        /* ---------- Quote ---------- */
        .quote-block {
            border-left: 2px solid var(--border-strong);
            padding: 4px 0 4px 22px;
            margin: 72px 0 8px;
        }

        .quote-text {
            font-size: 1.15rem;
            font-style: italic;
            line-height: 1.6;
            color: var(--text);
            margin-bottom: 8px;
        }

        .quote-explanation {
            font-size: 0.9rem;
            color: var(--muted);
            line-height: 1.65;
            margin-bottom: 10px;
            max-width: 60ch;
        }

        .quote-source {
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--muted);
            text-decoration: none;
            transition: color var(--ease);
        }

        .quote-source:hover {
            color: var(--text);
        }

        /* ---------- Footer ---------- */
        .site-footer {
            margin-top: 88px;
            border-top: 1px solid var(--border);
            padding: 28px 0 48px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .footer-text {
            font-size: 0.8rem;
            color: var(--muted);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .footer-socials {
            display: flex;
            gap: 18px;
        }

        .footer-socials a {
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--muted);
            text-decoration: none;
            transition: color var(--ease);
        }

        .footer-socials a:hover {
            color: var(--text);
        }

        /* ---------- Lightbox ---------- */
        .lightbox-overlay {
            position: fixed;
            inset: 0;
            background: rgba(10, 10, 12, 0.88);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }

        .lightbox-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .lightbox-stage {
            position: relative;
            max-width: 92vw;
            max-height: 84vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
        }

        .lightbox-img {
            max-width: 100%;
            max-height: 74vh;
            object-fit: contain;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .lightbox-count {
            font-size: 0.8rem;
            color: #c7c7cc;
            font-variant-numeric: tabular-nums;
        }

        .lightbox-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--ease);
        }

        .lightbox-btn:hover {
            background: rgba(255, 255, 255, 0.12);
        }

        .lightbox-btn svg,
        .lightbox-btn i {
            width: 18px;
            height: 18px;
        }

        .lightbox-prev {
            left: -64px;
        }

        .lightbox-next {
            right: -64px;
        }

        .lightbox-close-btn {
            position: absolute;
            bottom: -48px;
            left: 50%;
            transform: translateX(-50%);
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--ease);
        }

        .lightbox-close-btn:hover {
            background: rgba(255, 255, 255, 0.12);
        }

        .lightbox-close-btn svg,
        .lightbox-close-btn i {
            width: 16px;
            height: 16px;
        }

        /* ---------- Avatar popup ---------- */
        .avatar-overlay {
            position: fixed;
            inset: 0;
            background: rgba(10, 10, 12, 0.88);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }

        .avatar-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .avatar-stage {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            padding-bottom: 44px;
        }

        .avatar-popup-wrap {
            position: relative;
            width: min(56vw, 260px);
            height: min(56vw, 260px);
        }

        .avatar-popup-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.55);
            opacity: 0;
        }

        .avatar-overlay.active .avatar-popup-img {
            animation: avatar-pop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 0.05s forwards;
        }

        @keyframes avatar-pop {
            0% {
                opacity: 0;
                transform: scale(0.4) rotate(-12deg);
            }
            65% {
                opacity: 1;
                transform: scale(1.07) rotate(4deg);
            }
            100% {
                opacity: 1;
                transform: scale(1) rotate(0deg);
            }
        }

        .avatar-popup-ring {
            position: absolute;
            inset: -8px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.35);
            pointer-events: none;
        }

        .avatar-overlay.active .avatar-popup-ring {
            animation: avatar-ring 1.6s ease-out 0.35s infinite;
        }

        @keyframes avatar-ring {
            0% {
                transform: scale(1);
                opacity: 0.8;
            }
            100% {
                transform: scale(1.45);
                opacity: 0;
            }
        }

        .avatar-popup-name {
            font-size: 1.05rem;
            font-weight: 600;
            color: #fff;
            letter-spacing: -0.01em;
            opacity: 0;
        }

        .avatar-popup-role {
            font-size: 0.85rem;
            color: #c7c7cc;
            opacity: 0;
        }

        .avatar-overlay.active .avatar-popup-name {
            animation: avatar-fade 0.4s ease 0.25s forwards;
        }

        .avatar-overlay.active .avatar-popup-role {
            animation: avatar-fade 0.4s ease 0.3s forwards;
        }

        @keyframes avatar-fade {
            to {
                opacity: 1;
            }
        }

        /* ---------- Responsive ---------- */
        @media (max-width: 640px) {
            .nav-inner {
                padding: 0 16px;
            }

            .wordmark {
                font-size: 0.88rem;
            }

            .nav-links {
                gap: 6px;
            }

            .nav-links a {
                padding: 10px;
                font-size: 0;
            }

            .nav-links a .nav-label {
                display: none;
            }

            .nav-links a svg {
                width: 20px;
                height: 20px;
            }

            .work-grid {
                grid-template-columns: 1fr;
                gap: 28px;
            }

            .site-footer {
                flex-direction: column;
                align-items: center;
                text-align: center;
                gap: 14px;
            }

            .visit-card {
                justify-items: center;
            }

            .visit-email {
                justify-content: center;
            }

            .flip-footer {
                justify-content: center;
            }

            .lightbox-prev {
                left: 4px;
            }

            .lightbox-next {
                right: 4px;
            }

            .lightbox-btn {
                background: rgba(10, 10, 12, 0.5);
            }
        }

        @media (max-width: 480px) {
            .hero {
                padding-top: 48px;
            }

            .hero-name {
                font-size: 2.1rem;
            }

            .contact-panel {
                padding: 20px;
            }
        }

        /* ---------- Scroll reveal ---------- */
        .js .reveal {
            opacity: 0;
            transform: translateY(18px);
            transition: opacity 0.6s ease, transform 0.6s ease;
        }

        .js .reveal.visible {
            opacity: 1;
            transform: none;
        }

        /* ---------- Nav active state ---------- */
        .nav-links a.active {
            color: var(--text);
        }

        /* ---------- Back to top ---------- */
        .to-top {
            position: fixed;
            right: 20px;
            bottom: 20px;
            z-index: 60;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            opacity: 0;
            pointer-events: none;
            transform: translateY(8px);
            transition: opacity 0.25s ease, transform 0.25s ease, background-color 0.25s ease;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
        }

        .to-top.visible {
            opacity: 1;
            pointer-events: auto;
            transform: none;
        }

        .to-top:hover {
            background: var(--surface);
        }

        .to-top svg,
        .to-top i {
            width: 18px;
            height: 18px;
        }

        /* ---------- Resume ---------- */
        .resume-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 22px;
            border-radius: 10px;
            background: var(--primary);
            color: var(--primary-inverse);
            font-size: 0.9rem;
            font-weight: 600;
            text-decoration: none;
            transition: var(--ease);
        }

        .resume-btn:hover {
            opacity: 0.85;
        }

        .resume-btn svg,
        .resume-btn i {
            width: 16px;
            height: 16px;
        }

        /* ---------- Form status ---------- */
        .form-status {
            font-size: 0.85rem;
            font-weight: 500;
            min-height: 20px;
            text-align: center;
        }

        .form-status.success {
            color: #16a34a;
        }

        .form-status.error {
            color: #dc2626;
        }

        /* ---------- Focus ---------- */
        a:focus-visible,
        button:focus-visible {
            outline: 1.5px solid var(--primary);
            outline-offset: 3px;
            border-radius: 6px;
        }

        /* ---------- Reduced motion ---------- */
        @media (prefers-reduced-motion: reduce) {
            html {
                scroll-behavior: auto;
            }

            *,
            *::before,
            *::after {
                animation: none !important;
                transition: none !important;
            }
        }
    </style>
</head>

<body>

    <header class="site-nav">
        <div class="nav-inner">
            <a href="#top" class="wordmark">Jai Ganesh</a>
            <nav class="nav-links" aria-label="Primary">
                <a href="#work" aria-label="Work"><i data-lucide="grid"></i><span class="nav-label">Work</span></a>
                <a href="#skills" aria-label="Skills"><i data-lucide="wrench"></i><span class="nav-label">Skills</span></a>
                <a href="#contact" aria-label="Contact"><i data-lucide="mail"></i><span class="nav-label">Contact</span></a>
                <a href="#resume" aria-label="Resume"><i data-lucide="file-text"></i><span class="nav-label">Resume</span></a>
            </nav>
        </div>
    </header>

    <main id="top">
        <div class="container">

            <!-- Hero -->
            <section class="hero" id="hero-section"></section>

            <!-- Work -->
            <section id="work">
                <div class="section-head reveal">
                    <h2>Selected Work</h2>
                    <span class="rule"></span>
                    <span class="count" id="work-count"></span>
                </div>
                <div class="work-grid reveal" id="work-grid"></div>
            </section>

            <!-- Skills -->
            <section id="skills">
                <div class="section-head reveal">
                    <h2>Expertise</h2>
                    <span class="rule"></span>
                </div>
                <div class="skills-list reveal" id="skills-tags"></div>
            </section>

            <!-- Contact -->
            <section id="contact">
                <div class="section-head reveal">
                    <h2>Contact</h2>
                    <span class="rule"></span>
                </div>
                <div class="reveal" id="contact-panel"></div>
            </section>

            <!-- Resume -->
            <section id="resume">
                <div class="section-head reveal">
                    <h2>Resume</h2>
                    <span class="rule"></span>
                </div>
                <div class="reveal" id="resume-content"></div>
            </section>

            <!-- Quote -->
            <section id="quote-section" class="reveal"></section>

            <!-- Footer -->
            <footer class="site-footer" id="site-footer"></footer>

        </div>
    </main>

    <!-- Lightbox Modal overlay -->
    <div class="lightbox-overlay" id="lightbox" aria-modal="true" role="dialog" aria-label="Photo viewer">
        <div class="lightbox-stage">
            <button type="button" class="lightbox-close-btn" id="lightbox-close" aria-label="Close">
                <i data-lucide="x"></i>
            </button>
            <button type="button" class="lightbox-btn lightbox-prev" id="lightbox-prev" aria-label="Previous photo">
                <i data-lucide="chevron-left"></i>
            </button>
            <img src="" alt="Project photo" class="lightbox-img" id="lightbox-img">
            <button type="button" class="lightbox-btn lightbox-next" id="lightbox-next" aria-label="Next photo">
                <i data-lucide="chevron-right"></i>
            </button>
            <span class="lightbox-count" id="lightbox-count"></span>
        </div>
    </div>

    <!-- Avatar popup -->
    <div class="avatar-overlay" id="avatar-overlay" aria-modal="true" role="dialog" aria-label="Profile photo">
        <div class="avatar-stage">
            <div class="avatar-popup-wrap">
                <span class="avatar-popup-ring"></span>
                <img src="" alt="" class="avatar-popup-img" id="avatar-popup-img">
            </div>
            <p class="avatar-popup-name" id="avatar-popup-name"></p>
            <p class="avatar-popup-role" id="avatar-popup-role"></p>
            <button type="button" class="lightbox-close-btn" id="avatar-close" aria-label="Close">
                <i data-lucide="x"></i>
            </button>
        </div>
    </div>

    <!-- Back to top -->
    <button type="button" class="to-top" id="to-top" aria-label="Back to top">
        <i data-lucide="arrow-up"></i>
    </button>

    <!-- Dependencies -->
    <script src="assets/lib/lucide.min.js" defer></script>
    <script src="assets/lib/qrcode.min.js" defer></script>
    <script src="data.js" defer></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            document.documentElement.classList.add('js');

            const heroSection = document.getElementById('hero-section');
            const workGrid = document.getElementById('work-grid');
            const workCount = document.getElementById('work-count');
            const skillsTags = document.getElementById('skills-tags');
            const contactPanel = document.getElementById('contact-panel');
            const quoteSection = document.getElementById('quote-section');
            const siteFooter = document.getElementById('site-footer');
            const toTop = document.getElementById('to-top');

            /* ---------- Hero ---------- */
            function renderHero(profile) {
                if (!heroSection || !profile) return;

                const avatarHtml = profile.image
                    ? `<img src="${profile.image}" alt="${profile.name}" class="hero-avatar" role="button" tabindex="0" aria-label="View profile photo">`
                    : '';

                const socialsHtml = (profile.socials && profile.socials.length > 0) ? `
                    <div class="hero-socials">
                        ${profile.socials.map(s => `
                            <a href="${s.url}" target="_blank" rel="noopener" aria-label="${s.label || s.icon}">
                                <i data-lucide="${s.icon}"></i>
                            </a>
                        `).join('')}
                    </div>` : '';

                heroSection.innerHTML = `
                    <div class="hero-top">
                        ${avatarHtml}
                        ${socialsHtml}
                    </div>
                    <p class="hero-kicker">${profile.role || 'Designer &amp; Fabricator'}</p>
                    <h1 class="hero-name">${profile.name || ''}</h1>
                    <p class="hero-bio">${profile.bio || ''}</p>
                    <div class="hero-cta">
                        <a href="#work" class="btn btn-primary">View my work</a>
                        <a href="#contact" class="btn btn-ghost">Get in touch</a>
                    </div>
                `;
            }

            /* ---------- Work grid ---------- */
            function renderWork(projects) {
                if (!workGrid) return;

                const list = (projects || []).filter(c => c.isVisible !== false && c.type === 'project');

                if (workCount) workCount.textContent = `${list.length} projects`;

                workGrid.innerHTML = list.map((card, i) => {
                    const gallery = (card.images && card.images.length > 0) ? card.images : [];
                    const countBadge = (gallery.length > 1) ? `
                        <span class="project-count">
                            <i data-lucide="image"></i>
                            ${gallery.length}
                        </span>` : '';

                    return `
                        <div class="project-card">
                            <div class="project-media ${gallery.length > 0 ? 'zoomable' : ''}" data-gallery='${JSON.stringify(gallery)}'>
                                <img src="${card.image}" alt="${card.title}" loading="lazy">
                                ${countBadge}
                            </div>
                            <a href="${card.url}" target="_blank" rel="noopener" class="project-body-link">
                                <div class="project-body">
                                    <h3 class="project-title">${card.title}</h3>
                                    <span class="project-arrow"><i data-lucide="arrow-up-right"></i></span>
                                </div>
                                <p class="project-desc">${card.description}</p>
                            </a>
                        </div>
                    `;
                }).join('');
            }

            /* ---------- Skills ---------- */
            function renderSkills(links) {
                if (!skillsTags) return;
                const skillsCard = (links || []).find(c => c.type === 'skills');
                if (!skillsCard || !skillsCard.skills) return;

                skillsTags.innerHTML = skillsCard.skills.map(s => `
                    <div class="skill-row" data-level="${s.level}">
                        <div class="skill-top">
                            <span class="skill-name">${s.name}</span>
                            <span class="skill-level">${s.level}%</span>
                        </div>
                        <div class="skill-bar">
                            <div class="skill-bar-fill"></div>
                        </div>
                    </div>
                `).join('');

                const fills = () => skillsTags.querySelectorAll('.skill-row').forEach(row => {
                    const fill = row.querySelector('.skill-bar-fill');
                    if (fill) fill.style.width = row.dataset.level + '%';
                });

                if ('IntersectionObserver' in window) {
                    const io = new IntersectionObserver((entries) => {
                        entries.forEach(entry => {
                            if (entry.isIntersecting) {
                                fills();
                                io.disconnect();
                            }
                        });
                    }, { threshold: 0.2 });
                    io.observe(skillsTags);
                } else {
                    fills();
                }
            }

            /* ---------- Contact ---------- */
            function renderContact(profile, links) {
                if (!contactPanel) return;
                const qrCard = (links || []).find(c => c.type === 'email');
                const email = (qrCard && qrCard.url) ? qrCard.url : 'mailto:';
                const address = email.replace('mailto:', '');

                const socialsHtml = (profile.socials && profile.socials.length > 0) ? `
                    <div class="visit-socials">
                        ${profile.socials.map(s => `
                            <a href="${s.url}" target="_blank" rel="noopener" aria-label="${s.label || s.icon}">
                                <i data-lucide="${s.icon}"></i>
                            </a>
                        `).join('')}
                    </div>` : '';

                contactPanel.innerHTML = `
                    <div class="flip-card" id="flip-card">
                        <div class="flip-inner">

                            <div class="flip-face flip-front">
                                <div class="contact-panel">
                                    <div class="contact-info">
                                        <h3 class="contact-heading">Let's work together</h3>
                                        <p class="contact-blurb">Have a project in mind? Send me a message and I'll get back to you.</p>
                                    </div>
                                    <form class="contact-form" id="contact-form" novalidate>
                                        <div class="form-field">
                                            <label for="cf-name">Name</label>
                                            <input id="cf-name" name="name" type="text" required placeholder="Your name" autocomplete="name">
                                        </div>
                                        <div class="form-field">
                                            <label for="cf-email">Email</label>
                                            <input id="cf-email" name="email" type="email" required placeholder="you@example.com" autocomplete="email">
                                        </div>
                                        <div class="form-field">
                                            <label for="cf-message">Message</label>
                                            <textarea id="cf-message" name="message" rows="5" required placeholder="Tell me about your project"></textarea>
                                        </div>
                                        <p class="form-status" aria-live="polite"></p>
                                        <button type="submit" class="form-submit" id="contact-submit">
                                            <span>Send Message</span>
                                            <i data-lucide="arrow-up-right"></i>
                                        </button>
                                    </form>
                                </div>
                                <div class="flip-footer">
                                    <button type="button" class="flip-btn" id="flip-front-btn" aria-label="View business card">
                                        <i data-lucide="credit-card"></i>
                                    </button>
                                </div>
                            </div>

                            <div class="flip-face flip-back">
                                <div class="visit-card">
                                    <div class="visit-main">
                                        <div class="visit-head">
                                            ${profile.image ? `<img src="${profile.image}" alt="${profile.name}" class="visit-avatar">` : ''}
                                            <div>
                                                <p class="visit-name">${profile.name || ''}</p>
                                                <p class="visit-role">${profile.role || ''}</p>
                                            </div>
                                        </div>
                                        <a class="visit-email" href="${email}">
                                            <i data-lucide="mail"></i>
                                            ${address}
                                        </a>
                                        ${socialsHtml}
                                    </div>
                                    <div class="visit-qr">
                                        <div class="qr-container" id="qr-container"></div>
                                        <p class="visit-qr-caption">Scan to connect</p>
                                    </div>
                                </div>
                                <div class="flip-footer">
                                    <button type="button" class="flip-btn" id="flip-back-btn" aria-label="Back to form">
                                        <i data-lucide="rotate-ccw"></i>
                                    </button>
                                </div>
                            </div>

                        </div>
                    </div>
                `;

                const qrContainer = document.getElementById('qr-container');
                if (qrContainer && window.QRCode) {
                    new QRCode(qrContainer, {
                        text: email,
                        width: 140,
                        height: 140,
                        colorDark: "#0f0f11",
                        colorLight: "#ffffff",
                        correctLevel: QRCode.CorrectLevel.H
                    });
                }

                const flipCard = document.getElementById('flip-card');
                const flipFrontBtn = document.getElementById('flip-front-btn');
                const flipBackBtn = document.getElementById('flip-back-btn');
                if (flipCard && flipFrontBtn) {
                    flipFrontBtn.addEventListener('click', () => {
                        flipCard.classList.add('flipped');
                        flipCard.setAttribute('aria-label', 'Business card');
                    });
                }
                if (flipCard && flipBackBtn) {
                    flipBackBtn.addEventListener('click', () => {
                        flipCard.classList.remove('flipped');
                        flipCard.setAttribute('aria-label', 'Contact form');
                    });
                }

                const form = document.getElementById('contact-form');
                const formspreeId = (portfolioConfig.contact && portfolioConfig.contact.formspreeId) || '';

                if (form) {
                    form.addEventListener('submit', async (e) => {
                        e.preventDefault();
                        if (!form.checkValidity()) {
                            form.reportValidity();
                            return;
                        }

                        const payload = {
                            name: form.name.value.trim(),
                            email: form.email.value.trim(),
                            message: form.message.value.trim()
                        };

                        if (formspreeId) {
                            const status = form.querySelector('.form-status');
                            const btn = form.querySelector('.form-submit');
                            btn.disabled = true;
                            btn.querySelector('span').textContent = 'Sending...';
                            status.className = 'form-status';
                            status.textContent = '';
                            try {
                                const res = await fetch(`https://formspree.io/f/${formspreeId}`, {
                                    method: 'POST',
                                    headers: {
                                        'Content-Type': 'application/json',
                                        'Accept': 'application/json'
                                    },
                                    body: JSON.stringify(payload)
                                });
                                if (res.ok) {
                                    status.className = 'form-status success';
                                    status.textContent = 'Message sent. I\u2019ll get back to you.';
                                    form.reset();
                                } else {
                                    throw new Error('Request failed');
                                }
                            } catch (err) {
                                status.className = 'form-status error';
                                status.textContent = 'Something went wrong. Please email me directly.';
                            } finally {
                                btn.disabled = false;
                                btn.querySelector('span').textContent = 'Send Message';
                            }
                        } else if (email.startsWith('mailto:')) {
                            const subject = encodeURIComponent(`Portfolio message from ${payload.name}`);
                            const body = encodeURIComponent(
                                `Name: ${payload.name}\nEmail: ${payload.email}\n\n${payload.message}`
                            );
                            window.location.href = `${email}?subject=${subject}&body=${body}`;
                        }
                    });
                }
            }

            /* ---------- Quote ---------- */
            function renderQuote(links) {
                if (!quoteSection) return;
                const quote = (links || []).find(c => c.type === 'quote');
                if (!quote) return;

                const sourceHtml = quote.url
                    ? `<a href="${quote.url}" target="_blank" rel="noopener" class="quote-source">${quote.title || 'Source'}</a>`
                    : '';

                quoteSection.innerHTML = `
                    <div class="quote-block">
                        <p class="quote-text">${quote.text}</p>
                        ${quote.explanation ? `<p class="quote-explanation">${quote.explanation}</p>` : ''}
                        ${sourceHtml}
                    </div>
                `;
            }

            /* ---------- Footer ---------- */
            function renderFooter(profile) {
                if (!siteFooter) return;
                const year = new Date().getFullYear();

                const socialsHtml = (profile.socials && profile.socials.length > 0) ? `
                    <div class="footer-socials">
                        ${profile.socials.map(s => `
                            <a href="${s.url}" target="_blank" rel="noopener">${s.label || s.icon}</a>
                        `).join('')}
                    </div>` : '';

                siteFooter.innerHTML = `
                    <div class="footer-text">&copy; ${year} ${profile.name || ''}. All rights reserved.</div>
                    ${socialsHtml}
                `;
            }

            /* ---------- Lightbox ---------- */
            const lightbox = document.getElementById('lightbox');
            const lightboxImg = document.getElementById('lightbox-img');
            const lightboxCount = document.getElementById('lightbox-count');
            const lightboxClose = document.getElementById('lightbox-close');
            const lightboxPrev = document.getElementById('lightbox-prev');
            const lightboxNext = document.getElementById('lightbox-next');

            let gallery = [];
            let galleryIndex = 0;

            function openLightbox(imgs, index) {
                gallery = imgs;
                galleryIndex = index;
                lightboxImg.src = gallery[galleryIndex];
                lightboxCount.textContent = `${galleryIndex + 1} / ${gallery.length}`;
                lightbox.classList.add('active');
            }

            function closeLightbox() {
                lightbox.classList.remove('active');
                setTimeout(() => { lightboxImg.src = ''; }, 250);
            }

            function stepLightbox(dir) {
                galleryIndex = (galleryIndex + dir + gallery.length) % gallery.length;
                lightboxImg.src = gallery[galleryIndex];
                lightboxCount.textContent = `${galleryIndex + 1} / ${gallery.length}`;
            }

            document.addEventListener('click', (e) => {
                const media = e.target.closest('.project-media[data-gallery]');
                if (media) {
                    const imgs = JSON.parse(media.getAttribute('data-gallery') || '[]');
                    if (imgs.length > 0) {
                        e.preventDefault();
                        openLightbox(imgs, 0);
                    }
                }
            });

            lightboxClose.addEventListener('click', closeLightbox);
            lightboxPrev.addEventListener('click', () => stepLightbox(-1));
            lightboxNext.addEventListener('click', () => stepLightbox(1));

            lightbox.addEventListener('click', (e) => {
                if (e.target === lightbox) closeLightbox();
            });

            /* ---------- Avatar popup ---------- */
            const avatarOverlay = document.getElementById('avatar-overlay');
            const avatarImg = document.getElementById('avatar-popup-img');
            const avatarName = document.getElementById('avatar-popup-name');
            const avatarRole = document.getElementById('avatar-popup-role');
            const avatarClose = document.getElementById('avatar-close');

            function openAvatarPopup() {
                const avatar = document.querySelector('.hero-avatar');
                const name = document.querySelector('.hero-name');
                const role = document.querySelector('.hero-kicker');
                avatarImg.src = avatar ? avatar.src : '';
                avatarName.textContent = name ? name.textContent : '';
                avatarRole.textContent = role ? role.textContent : '';
                avatarOverlay.classList.add('active');
            }

            function closeAvatarPopup() {
                avatarOverlay.classList.remove('active');
                setTimeout(() => { avatarImg.src = ''; }, 250);
            }

            document.addEventListener('click', (e) => {
                if (e.target.closest('.hero-avatar')) openAvatarPopup();
            });

            avatarClose.addEventListener('click', closeAvatarPopup);
            avatarOverlay.addEventListener('click', (e) => {
                if (e.target === avatarOverlay) closeAvatarPopup();
            });

            document.addEventListener('keydown', (e) => {
                if (lightbox.classList.contains('active')) {
                    if (e.key === 'Escape') closeLightbox();
                    if (e.key === 'ArrowLeft') stepLightbox(-1);
                    if (e.key === 'ArrowRight') stepLightbox(1);
                    return;
                }
                if (avatarOverlay.classList.contains('active') && e.key === 'Escape') closeAvatarPopup();
            });

            /* ---------- Resume ---------- */
            function renderResume(profile) {
                const el = document.getElementById('resume-content');
                if (!el || !profile || !profile.resume || !profile.resume.url) return;
                el.innerHTML = `
                    <a class="resume-btn" href="${profile.resume.url}" download>
                        <i data-lucide="download"></i>
                        ${profile.resume.label || 'Download Resume'}
                    </a>
                `;
            }

            /* ---------- Scroll reveal ---------- */
            function initReveal() {
                const els = document.querySelectorAll('.reveal');
                if (!('IntersectionObserver' in window)) {
                    els.forEach(el => el.classList.add('visible'));
                    return;
                }
                const io = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            entry.target.classList.add('visible');
                            io.unobserve(entry.target);
                        }
                    });
                }, { threshold: 0.1 });
                els.forEach(el => io.observe(el));
            }

            /* ---------- Scrollspy ---------- */
            function initScrollspy() {
                const navLinks = document.querySelectorAll('.nav-links a');
                const targets = ['work', 'skills', 'resume', 'contact'];
                if (!('IntersectionObserver' in window)) return;

                const io = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            navLinks.forEach(link => {
                                link.classList.toggle('active', link.getAttribute('href') === '#' + entry.target.id);
                            });
                        }
                    });
                }, { rootMargin: '-45% 0px -50% 0px' });

                targets.forEach(id => {
                    const el = document.getElementById(id);
                    if (el) io.observe(el);
                });
            }

            /* ---------- Back to top ---------- */
            function initToTop() {
                if (!toTop) return;
                window.addEventListener('scroll', () => {
                    toTop.classList.toggle('visible', window.scrollY > 600);
                }, { passive: true });
                toTop.addEventListener('click', () => {
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                });
            }

            /* ---------- Init ---------- */
            function init() {
                if (typeof portfolioConfig === 'undefined') {
                    console.error('portfolioConfig is not loaded. Make sure data.js is loaded first.');
                    return;
                }

                const profile = portfolioConfig.profile;
                const links = portfolioConfig.links;

                renderHero(profile);
                renderWork(links);
                renderSkills(links);
                renderContact(profile, links);
                renderQuote(links);
                renderResume(profile);
                renderFooter(profile);

                if (window.lucide) lucide.createIcons();

                initReveal();
                initScrollspy();
                initToTop();
            }

            init();
        });
    </script>
</body>

</html>
